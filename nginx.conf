# Caching front for LTEngine, inside the translation image. The cache lives here rather than in the
# site's nginx so that the translation service stays self-contained: whoever proxies to it gets the
# caching behaviour for free and cannot forget a directive.
worker_processes 1;
daemon off;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    access_log off;
    default_type application/json;

    # Everything writable lives under /tmp so the image can run as a non-root user.
    client_body_temp_path /tmp/nginx-client-body;
    proxy_temp_path       /tmp/nginx-proxy;
    fastcgi_temp_path     /tmp/nginx-fastcgi;
    uwsgi_temp_path       /tmp/nginx-uwsgi;
    scgi_temp_path        /tmp/nginx-scgi;

    # A translation costs seconds to produce and never changes for a given source text, so cache it
    # keyed by the request body. An OSM edit changes the text, which changes the key - nothing to expire.
    proxy_cache_path /var/cache/nginx/translation levels=1:2 keys_zone=translation:10m
                     max_size=1g inactive=365d use_temp_path=off;

    server {
        listen 5050;
        client_max_body_size 1m;

        location / {
            proxy_cache              translation;
            proxy_cache_methods      POST;
            proxy_cache_key          "$request_uri|$request_body";
            proxy_cache_valid        200 365d;
            # Collapse concurrent identical misses into a single upstream call. LTEngine serves one
            # request at a time behind a mutex, so without this a burst queues up behind itself.
            proxy_cache_lock         on;
            proxy_cache_lock_timeout 300s;
            # $request_body is empty once the body spills to a temp file, which would poison the key.
            client_body_buffer_size  64k;
            proxy_read_timeout       300s;
            # Finish and cache the translation even when the caller gave up on it. The app times out
            # at 10s and falls back to the untranslated text, but the answer is warm for the next
            # viewer, so a slow model never has to fit inside the request the user is waiting on.
            proxy_ignore_client_abort on;

            add_header X-Translation-Cache $upstream_cache_status always;

            proxy_pass http://127.0.0.1:5051;
        }
    }
}
