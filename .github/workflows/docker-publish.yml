name: Docker Publish

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ghcr.io/mapeak-com/translation:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # amd64 only, which is what the server runs. The image is just Debian packages and a Python
          # script now, so adding linux/arm64 (with docker/setup-qemu-action) would be cheap if needed.
          platforms: linux/amd64
