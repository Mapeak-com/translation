name: Docker Publish

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ghcr.io/mapeak-com/translation:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # amd64 only, unlike the other services. This image compiles llama.cpp, which takes minutes
          # natively and hours under QEMU - long enough to hit the 6 hour job limit. The server this
          # runs on is amd64; to also publish arm64, add a native ubuntu-24.04-arm runner in a matrix
          # and merge the per-arch digests with "docker buildx imagetools create" rather than emulating.
          platforms: linux/amd64
