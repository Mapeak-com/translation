name: API Tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  docker:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    - name: Build the image
      run: docker build . -t mapeak/translation

    - name: Run the image and check it translates
      run: |
        # Calls the real Google API, so the GOOGLE_API_KEY repository secret has to be set.
        docker run -d --rm --name translation -p 5050:5050 -e GOOGLE_API_KEY="${{ secrets.GOOGLE_API_KEY }}" mapeak/translation
        npx wait-on -t 60000 http://localhost:5050/health

        translated=$(curl -fsS -X POST http://localhost:5050/translate \
          -H 'Content-Type: application/json' \
          -d '{"q":"Hola mundo","source":"auto","target":"en","format":"text"}' \
          | python3 -c 'import json,sys; print(json.load(sys.stdin)["translatedText"])')
        echo "translated: $translated"
        test -n "$translated"

        # The same request a second time has to come back from the cache, which is the whole point
        # of putting nginx in this image.
        cache_status=$(curl -fsS -o /dev/null -D - -X POST http://localhost:5050/translate \
          -H 'Content-Type: application/json' \
          -d '{"q":"Hola mundo","source":"auto","target":"en","format":"text"}' \
          | grep -i '^x-translation-cache:' | tr -d '\r' | awk '{print $2}')
        echo "cache status: $cache_status"
        test "$cache_status" = "HIT"

        docker stop translation
