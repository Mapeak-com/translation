name: API Tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  docker:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    - name: Build the image
      run: docker build . -t mapeak/translation

    - name: Run the image and check it is wired up
      run: |
        # No real key on purpose: Google is trusted to translate. This checks the container starts,
        # nginx reaches the adapter, and a failed translation comes back in LibreTranslate's error
        # format without being cached.
        docker run -d --name translation -p 5050:5050 -e GOOGLE_API_KEY=invalid mapeak/translation
        npx wait-on -t 60000 http://localhost:5050/health

        # The app's web view sends a CORS preflight before every JSON POST; without a 2xx the
        # browser never sends the translation request.
        preflight=$(curl -sS -o /dev/null -w '%{http_code}' -X OPTIONS http://localhost:5050/translate \
          -H 'Origin: https://localhost' -H 'Access-Control-Request-Method: POST' \
          -H 'Access-Control-Request-Headers: content-type')
        echo "preflight: $preflight"
        test "$preflight" = "204"

        request() {
          curl -sS -o body.json -D headers.txt -w '%{http_code}' -X POST http://localhost:5050/translate \
            -H 'Content-Type: application/json' \
            -d '{"q":"Hola mundo","source":"auto","target":"en","format":"text"}'
        }

        status=$(request)
        echo "status: $status"; cat body.json; echo
        test "$status" = "400"
        python3 -c 'import json; assert "error" in json.load(open("body.json"))'

        # Errors must never be cached, or one bad response would be served for a year.
        request > /dev/null
        cache_status=$(grep -i '^x-translation-cache:' headers.txt | tr -d '\r' | awk '{print $2}')
        echo "cache status: $cache_status"
        test "$cache_status" = "MISS"

    - name: Show container logs
      if: always()
      run: docker logs translation || true
